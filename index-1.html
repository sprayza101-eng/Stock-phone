<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>สต็อกมือถือ</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1b2430;--mute:#66707d;--line:#dde1e7;--acc:#0b5fd9;--accbg:#e6efff;--warn:#b45309}
@media (prefers-color-scheme:dark){:root{--bg:#12161c;--card:#1a2029;--ink:#e8ecf1;--mute:#93a0b0;--line:#2b3441;--acc:#6ea4ff;--accbg:#1c2a45;--warn:#f0a34a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Sarabun",system-ui,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
h1{font-size:22px;margin:0}
.btn{background:var(--acc);color:#fff;border:0;border-radius:8px;font:inherit;font-weight:500;padding:8px 16px;cursor:pointer}
.btn:disabled{opacity:.6}
.mute{color:var(--mute);font-size:14px}.err{color:var(--warn);font-size:14px}
.brands{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin:8px 0}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;font:inherit;padding:6px 14px;cursor:pointer}
.chip b{margin-left:6px;color:var(--mute);font-weight:500}
.chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff}
.chip[aria-pressed=true] b{color:#fff}
input[type=search]{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);margin-bottom:12px}
.sum{display:flex;gap:20px;margin-bottom:12px;font-size:14px;color:var(--mute)}.sum strong{color:var(--ink);font-size:18px}
details{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
summary{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
.mn{flex:1;min-width:0}.mn div:first-child{font-weight:500;overflow-wrap:anywhere}
.qty{background:var(--accbg);color:var(--acc);font-weight:700;border-radius:8px;padding:2px 10px;white-space:nowrap}
.vars{border-top:1px solid var(--line);padding:4px 14px 8px}
.v{display:flex;gap:10px;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.v:last-child{border:0}.v .n{overflow-wrap:anywhere}.v .q{font-weight:700;white-space:nowrap}
.empty{text-align:center;padding:40px 16px;color:var(--mute)}
.upb{border-top:1px solid var(--line);padding:12px 14px;display:grid;gap:8px}
.upb input{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
.upb .ok{color:#0f7b4b;font-size:14px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>สต็อกมือถือ</h1><div class="mute" id="upd">กำลังโหลด...</div></div>
    <button class="btn" id="ref">รีเฟรช</button>
  </div>
  <div class="err" id="err"></div>
  <details id="up"><summary>อัปโหลดข้อมูล (สำหรับผู้ดูแล)</summary>
    <div class="upb">
      <input id="aurl" placeholder="ลิงก์ Apps Script (ตั้งครั้งเดียว)">
      <input id="apw" type="password" placeholder="รหัสผ่าน">
      <input type="file" id="file" accept=".xlsx,.xls,.csv">
      <button class="btn" id="go">อัปโหลดและแทนที่ข้อมูลทั้งหมด</button>
      <div id="umsg" class="mute"></div>
    </div>
  </details>
  <div class="brands" id="brands"></div>
  <input type="search" id="q" placeholder="ค้นหารุ่น สี หรือบาร์โค้ด">
  <div class="sum" id="sum"></div>
  <div id="list"></div>
</div>

<script>
// ใส่รหัสชีตของคุณตรงนี้ (ส่วนระหว่าง /d/ กับ /edit ในลิงก์ Google Sheets)
const SHEET_ID='1lNDFr-XZ9NwaUZRLJgJvYrhMMNnCUcNn6qx1wFCgHCY';
const URL_CSV='https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq?tqx=out:csv';
const KEY='phone-stock-cache-v2';
let rows=[],brand='ALL';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>{const n=parseFloat(String(v??'').replace(/,/g,''));return isNaN(n)?0:n};
const baht=n=>n?'฿'+n.toLocaleString('th-TH'):'-';

function normalize(json){
  const out=[];
  for(const r of json){
    const k={};for(const key in r)k[key.trim().toLowerCase()]=r[key];
    const name=String(k['name']??'').trim();
    if(!name)continue;
    out.push({code:String(k['product']??''),name,qty:num(k['number']),price:num(k['set price']),
      brand:String(k['brand']||name.split(' ')[0]).trim().toUpperCase(),model:String(k['model']||name).trim()});
  }
  return out;
}

async function load(){
  $('ref').disabled=true;$('err').textContent='';
  try{
    const res=await fetch(URL_CSV+'&_='+Date.now());
    if(!res.ok)throw new Error('HTTP '+res.status);
    const wb=XLSX.read(await res.text(),{type:'string'});
    rows=normalize(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:'',raw:false}));
    if(!rows.length)throw new Error('ไม่พบข้อมูล ตรวจสอบหัวคอลัมน์ Name, Number, Brand, Model');
    const t=new Date().toLocaleString('th-TH',{dateStyle:'medium',timeStyle:'short'});
    try{localStorage.setItem(KEY,JSON.stringify({rows,t}))}catch(_){}
    $('upd').textContent='อัปเดตล่าสุด '+t;
  }catch(e){
    let c=null;try{c=JSON.parse(localStorage.getItem(KEY))}catch(_){}
    if(c){rows=c.rows;$('upd').textContent='ข้อมูลเก่าจาก '+c.t}else{$('upd').textContent=''}
    $('err').textContent='โหลดจาก Google Sheets ไม่ได้ ('+e.message+') ตรวจสอบว่าตั้งแชร์เป็น "ทุกคนที่มีลิงก์ ดูได้"';
  }
  $('ref').disabled=false;render();
}

function render(){
  const bs={};rows.forEach(r=>bs[r.brand]=(bs[r.brand]||0)+r.qty);
  const total=rows.reduce((a,r)=>a+r.qty,0);
  $('brands').innerHTML=[['ALL','ทั้งหมด',total],...Object.keys(bs).sort().map(n=>[n,n,bs[n]])]
    .map(([v,l,c])=>`<button class="chip" data-b="${esc(v)}" aria-pressed="${v===brand}">${esc(l)}<b>${c}</b></button>`).join('');
  $('brands').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{brand=b.dataset.b;render()});
  const q=$('q').value.trim().toLowerCase();
  const list=rows.filter(r=>(brand==='ALL'||r.brand===brand)&&(!q||(r.name+r.model+r.code).toLowerCase().includes(q)));
  const g={};
  list.forEach(r=>{const k=r.model.toLowerCase();(g[k]=g[k]||{model:r.model,items:[]}).items.push(r)});
  const models=Object.values(g).sort((a,b)=>a.model.localeCompare(b.model));
  $('sum').innerHTML=`<div><strong>${models.length}</strong> รุ่น</div><div><strong>${list.length}</strong> รายการ</div><div><strong>${list.reduce((a,r)=>a+r.qty,0)}</strong> เครื่อง</div>`;
  if(!models.length){$('list').innerHTML='<div class="empty">'+(rows.length?'ไม่พบรุ่นที่ตรงกับที่เลือก':'ยังไม่มีข้อมูล')+'</div>';return}
  $('list').innerHTML=models.map(m=>{
    const t=m.items.reduce((a,r)=>a+r.qty,0);
    return `<details><summary><div class="mn"><div>${esc(m.model)}</div><div class="mute">${esc(m.items[0].brand)} · ${baht(m.items[0].price)}</div></div><span class="qty">${t} เครื่อง</span></summary>
    <div class="vars">${m.items.map(r=>`<div class="v"><div class="n">${esc(r.name)}<div class="mute">${esc(r.code)}</div></div><div class="q">${r.qty}</div></div>`).join('')}</div></details>`;
  }).join('');
}
try{$('aurl').value=localStorage.getItem('as-url')||'';$('apw').value=localStorage.getItem('as-pw')||''}catch(_){}
$('go').onclick=async()=>{
  const f=$('file').files[0],url=$('aurl').value.trim(),pw=$('apw').value,m=$('umsg');
  m.className='mute';
  if(!url||!pw||!f){m.textContent='กรอกลิงก์ Apps Script รหัสผ่าน และเลือกไฟล์ให้ครบ';return}
  $('go').disabled=true;m.textContent='กำลังอ่านไฟล์...';
  try{
    const wb=XLSX.read(await f.arrayBuffer(),{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]];
    const data=normalize(XLSX.utils.sheet_to_json(ws,{defval:'',raw:false}));
    if(!data.length)throw new Error('ไม่พบข้อมูล ตรวจสอบหัวคอลัมน์ Name, Number, Brand, Model');
    let aoa=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:false}).filter(r=>r.some(c=>String(c).trim()));
    const w=Math.max(...aoa.map(r=>r.length));aoa=aoa.map(r=>{r=r.slice();while(r.length<w)r.push('');return r});
    if(!confirm('แทนที่ข้อมูลเดิมในชีตด้วย '+data.length+' รายการ?'))throw new Error('ยกเลิก');
    m.textContent='กำลังอัปโหลด...';
    const res=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({pass:pw,rows:aoa})});
    const j=await res.json();
    if(!j.ok)throw new Error(j.error||'อัปโหลดไม่สำเร็จ');
    try{localStorage.setItem('as-url',url);localStorage.setItem('as-pw',pw)}catch(_){}
    rows=data;$('upd').textContent='อัปเดตล่าสุด '+new Date().toLocaleString('th-TH',{dateStyle:'medium',timeStyle:'short'});
    render();m.className='ok';m.textContent='อัปโหลดสำเร็จ '+j.count+' รายการ ทุกคนจะเห็นข้อมูลใหม่เมื่อรีเฟรช';
  }catch(e){m.className='err';m.textContent=e.message}
  $('go').disabled=false;
};
$('q').oninput=render;$('ref').onclick=load;load();
</script>
</body>
</html>
